name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时检查一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Add upstream remote
      run: |
        git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git || true
        git fetch upstream
    
    - name: Merge upstream main
      run: |
        git checkout main || git checkout -b main
        git merge upstream/main --no-edit || echo "Already up to date or conflicts exist"
        git push origin main || echo "Nothing to push or push failed"
    
    - name: Rebase tv-optimization on updated main
      run: |
        git checkout tv-optimization
        git rebase main || {
          echo "Rebase conflicts detected - manual intervention needed"
          git rebase --abort
          exit 1
        }
        git push origin tv-optimization --force-with-lease
